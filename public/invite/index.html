<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening RatePocket invitation…</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Family invite bridge for the RatePocket app. This is not the product homepage.">
  <link rel="icon" href="/brand/logo-r.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: #0a0a0e;
      color: #f4f4f7;
    }
    .card {
      max-width: 28rem;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      font-weight: 800;
    }
    p {
      margin: 0 0 12px;
      line-height: 1.5;
      color: #b8b8c4;
      font-size: 0.95rem;
    }
    a {
      color: #a78bfa;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Opening RatePocket…</h1>
    <p id="status">Opening your family invitation in the app.</p>
    <p id="hint" hidden>
      If nothing opens, <a id="deep" href="#">tap here to open in RatePocket</a>.
      Install from <a href="https://play.google.com/store/apps/details?id=com.tradali.calculator">Google Play</a> if needed.
    </p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var id = (params.get('id') || '').trim();
      var appOrigin = params.get('app_origin');

      function setStatus(text) {
        var el = document.getElementById('status');
        if (el) el.textContent = text;
      }

      function showHint(deepHref) {
        var hint = document.getElementById('hint');
        var deep = document.getElementById('deep');
        if (deep) deep.href = deepHref;
        if (hint) hint.hidden = false;
      }

      if (!id) {
        setStatus('No invitation id was found in this link. Ask the owner to send a new invitation.');
        showHint('https://ratepocket.tradali.com/');
        var deepMissing = document.getElementById('deep');
        if (deepMissing) deepMissing.textContent = 'Back to RatePocket homepage';
        return;
      }

      // Web Expo app: open invite on the local app origin when allowed.
      if (appOrigin) {
        try {
          var originUrl = new URL(appOrigin);
          var host = originUrl.hostname;
          var allowed =
            (originUrl.protocol === 'http:' || originUrl.protocol === 'https:') &&
            (host === 'localhost' || host === '127.0.0.1');
          if (allowed) {
            setStatus('Sending you to the RatePocket app…');
            window.location.replace(
              originUrl.origin + '/invite?id=' + encodeURIComponent(id)
            );
            return;
          }
        } catch (e) {
          /* fall through to deep link */
        }
      }

      var deepLink = 'ratepocket://family/invite?id=' + encodeURIComponent(id);
      showHint(deepLink);
      setStatus('Opening the RatePocket app…');
      window.location.replace(deepLink);
    })();
  </script>
</body>
</html>
